<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Hikari - AI Avatar</title>
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <style>
        :root {
            color-scheme: dark;
            --panel: rgba(14, 17, 19, 0.88);
            --panel-border: rgba(255, 255, 255, 0.12);
            --accent: #4caf50;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --keyboard-inset: 0px;
            --visible-height: 100dvh;
            --composer-reserve: 80px;
            --hikari-background-image: url('/loading.gif');
        }
        * { box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%; margin: 0; overflow: hidden;
            background-color: #0b0d0e; color: #f5f5f5;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        body {
            min-height: 100dvh;
            background-image: var(--hikari-background-image);
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        canvas { position: fixed; inset: 0; display: block; width: 100% !important; height: 100% !important; background: transparent; touch-action: none; }
        button, input, select { font: inherit; }
        button { -webkit-tap-highlight-color: transparent; }

        .controls, .settings-panel, #history-panel {
            color: #fff; background: var(--panel); border: 1px solid var(--panel-border);
            border-radius: 16px; box-shadow: 0 12px 40px rgba(0,0,0,.32);
            -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
        }
        .controls {
            position: fixed; z-index: 100; top: max(12px, env(safe-area-inset-top)); left: max(12px, env(safe-area-inset-left));
            width: min(390px, calc(100vw - 24px)); padding: 16px; display: flex; flex-direction: column; gap: 12px;
        }
        .controls > div { display: flex; align-items: center; gap: 10px; }
        .controls label { min-width: 108px; color: #dedede; font-size: 13px; }
        .controls input[type="text"], .controls input[type="password"], .controls select {
            min-width: 0; flex: 1; width: 100%; padding: 10px 12px; color: #fff;
            background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18); border-radius: 9px; outline: none;
        }
        .controls input:focus, .controls select:focus { border-color: var(--accent); }
        .controls button, .settings-panel button {
            min-height: 42px; padding: 10px 14px; color: #fff; background: linear-gradient(145deg,#4caf50,#2e8b57);
            border: 0; border-radius: 9px; cursor: pointer; font-weight: 650;
        }
        .controls button:disabled, .settings-panel button:disabled { opacity: .5; cursor: not-allowed; }
        .full-width-btn { width: 100%; }
        .status-message { padding-top: 8px; color: #bdbdbd; border-top: 1px solid rgba(255,255,255,.1); font-size: 12px; line-height: 1.35; text-align: center; }

        .settings-panel {
            position: fixed; z-index: 100; left: max(12px, env(safe-area-inset-left)); bottom: calc(12px + var(--safe-bottom));
            width: min(520px, calc(100vw - 24px)); padding: 12px;
        }
        .settings-panel > div { display: flex; align-items: center; gap: 8px; }
        .settings-panel input { flex: 1; min-width: 0; width: 100%; padding: 11px 13px; color: #fff; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18); border-radius: 9px; outline: none; }
        .settings-panel input:focus { border-color: var(--accent); }
        .settings-panel button { min-width: 48px; padding-inline: 12px; }
        .light-control { display: block !important; }
        .light-control label { display: block; margin-bottom: 5px; font-size: 12px; }
        .light-control input[type="range"] { width: 100%; accent-color: var(--accent); }
        .anim-toggles { display: block !important; padding-top: 10px; border-top: 1px solid rgba(255,255,255,.1); }
        .anim-section-label { margin-bottom: 8px; font-size: 12px; font-weight: 700; text-transform: uppercase; }
        .anim-checkbox-grid { display: flex; flex-wrap: wrap; gap: 8px 12px; }
        .anim-checkbox-item { display: inline-flex !important; min-width: auto !important; gap: 5px !important; font-size: 12px !important; }

        .toggle-btn {
            position: fixed; z-index: 200; width: 48px; height: 48px; padding: 0; color: #fff;
            background: rgba(18,22,24,.82); border: 1px solid rgba(255,255,255,.16); border-radius: 50%;
            box-shadow: 0 8px 24px rgba(0,0,0,.3); cursor: pointer; font-size: 21px; opacity: .92;
        }
        .toggle-btn:hover, .toggle-btn:focus-visible { background: rgba(76,175,80,.85); outline: none; }
        #lipSyncPanel {
            position: fixed; z-index: 120; right: 0; bottom: calc(8px + var(--keyboard-inset) + var(--safe-bottom)); left: 0;
            display: flex; width: 100%; min-height: 64px; padding: 8px max(8px, env(safe-area-inset-right)) 8px max(8px, env(safe-area-inset-left));
            background: transparent !important; border: 0 !important; border-radius: 0 !important; box-shadow: none !important;
            -webkit-backdrop-filter: none !important; backdrop-filter: none !important;
        }
        #webComposerRow { display: flex; align-items: center; gap: 8px; width: 100%; min-width: 0; flex-wrap: nowrap; }
        #webComposerRow input {
            flex: 1 1 auto; min-width: 0; width: auto; height: 48px; padding: 0 14px; color: #fff; font-size: 16px;
            background: rgba(14,17,19,.5); border: 1px solid rgba(255,255,255,.2); border-radius: 14px; outline: none;
            -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
        }
        #webComposerRow input:focus { border-color: rgba(112,210,126,.8); }
        #webComposerRow button {
            display: inline-flex; flex: 0 0 48px; align-items: center; justify-content: center; width: 48px; height: 48px; min-width: 48px; min-height: 48px;
            padding: 0; color: #fff; background: rgba(18,22,24,.5); border: 1px solid rgba(255,255,255,.2); border-radius: 14px;
            box-shadow: 0 5px 18px rgba(0,0,0,.18); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); cursor: pointer;
        }
        #webComposerRow #speakBtnPanel { color: #fff; background: rgba(54,160,77,.58); border-color: rgba(132,229,145,.48); font-size: 22px; }
        #webComposerRow #speakBtnPanel:hover:not(:disabled) { background: rgba(54,180,78,.78); }
        #webComposerRow .history-toggle {
            position: static !important; inset: auto !important; display: inline-flex; flex: 0 0 48px; width: 48px; height: 48px; min-width: 48px; min-height: 48px;
            padding: 0; color: #fff; background: rgba(18,22,24,.5); border: 1px solid rgba(255,255,255,.2); border-radius: 14px;
            box-shadow: 0 5px 18px rgba(0,0,0,.18); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); opacity: 1;
        }
        #webComposerRow .history-toggle:hover, #webComposerRow .history-toggle:focus-visible { background: rgba(76,175,80,.56); outline: none; }
        #history-panel {
            position: fixed !important; right: max(10px, env(safe-area-inset-right)) !important;
            bottom: calc(var(--composer-reserve) + var(--keyboard-inset) + var(--safe-bottom)) !important;
            left: max(10px, env(safe-area-inset-left)) !important; z-index: 130 !important; width: auto !important; max-width: none !important;
            max-height: min(55dvh, 520px, calc(var(--visible-height, 100dvh) - var(--composer-reserve) - 24px - var(--safe-bottom))) !important;
            overflow-y: auto;
        }
        .speaking-bubble { position: fixed; z-index: 1000; max-width: min(320px,calc(100vw - 32px)); padding: 10px 14px; color: #fff; background: rgba(0,0,0,.86); border: 1px solid rgba(255,255,255,.14); border-radius: 16px; box-shadow: 0 6px 22px rgba(0,0,0,.4); pointer-events: none; white-space: pre-wrap; overflow-wrap: anywhere; }
        #glassOverlay { position: fixed; inset: 0; z-index: 9999; display: none; background: rgba(0,0,0,.96); }
        #loadingInfo { position: fixed; inset: 50% auto auto 50%; z-index: 10000; display: none; transform: translate(-50%,-50%); text-align: center; }
        .loading-text { color: var(--accent); font-weight: 700; }
        .loading-percentage { margin: 14px 0; color: var(--accent); font-size: 40px; font-weight: 800; }
        .loading-bar { width: min(300px,70vw); height: 7px; overflow: hidden; background: #252a2b; border-radius: 4px; }
        .loading-progress { width: 0; height: 100%; background: var(--accent); transition: width .2s ease; }

        .settings-open #history-panel { visibility: hidden; }
        #connectionBar { position: fixed; z-index: 210; top: max(12px, env(safe-area-inset-top)); left: 72px; right: 12px; display: flex; justify-content: flex-end; align-items: center; gap: 8px; font-size: 12px; pointer-events: none; transition: opacity .3s ease, visibility .3s ease; }
        #connectionBar.is-dismissed { opacity: 0; visibility: hidden; }
        #connectionStatus { padding: 7px 10px; border-radius: 12px; background: rgba(14,17,19,.85); }
        #retryConnection, #enableAudio { pointer-events: auto; min-height: 44px; border-radius: 12px; border: 1px solid #63886b; background: #214f31; color: white; padding: 10px 14px; }
        #enableAudio { position: fixed; z-index: 10001; top: 25%; left: 50%; transform: translateX(-50%); width: min(300px, 85vw); }
        [hidden] { display: none !important; }
        @media (hover:none) { .toggle-btn:hover { background: rgba(18,22,24,.82); } }
        @media (max-width:600px), (pointer: coarse) {
            #lipSyncPanel { display: flex !important; }
            .controls { top: auto; right: 0; bottom: calc(var(--composer-reserve) + var(--keyboard-inset) + var(--safe-bottom)); left: 0; width: 100%; max-height: min(72dvh, 620px, calc(var(--visible-height, 100dvh) - var(--composer-reserve) - 72px - var(--safe-bottom))); overflow-y: auto; padding: 14px 14px 20px; border-right: 0; border-bottom: 0; border-radius: 18px 18px 0 0; }
            .controls > div { align-items: stretch; flex-direction: column; gap: 6px; }
            .controls label { min-width: 0; }
            .settings-panel input { font-size: 16px; }
            .settings-toggle { left: 12px !important; top: max(12px,env(safe-area-inset-top)) !important; }
        }
    </style>
</head>
<body>
    <div id="connectionBar" role="status"><span id="connectionStatus">Connecting to this computer…</span><button id="retryConnection" type="button">Retry</button></div>
    <button id="enableAudio" type="button" hidden>Tap to play Hikari’s voice</button>
    <div id="glassOverlay" aria-hidden="true"></div>
    <section class="controls" id="settingsPanel" style="display:none" aria-label="Settings">
        <div class="light-control"><label for="speakingSpeedSlider">Speaking speed: <span id="speakingSpeedValue">1.0x</span></label><input type="range" id="speakingSpeedSlider" min="0.5" max="2" step="0.1" value="1" /></div>
        <label for="animationSelect">Animation</label>
        <select id="animationSelect" disabled><option value="">Select animation</option></select>
        <label for="expressionSelect">Expression</label>
        <select id="expressionSelect" disabled><option value="neutral">Neutral</option><option value="happy">Happy</option><option value="sad">Sad</option><option value="angry">Angry</option><option value="surprised">Surprised</option><option value="shy">Shy</option><option value="shocked">Shocked</option></select>
        <div class="anim-toggles"><div class="anim-section-label">Animation toggles</div><div class="anim-checkbox-grid">
            <label class="anim-checkbox-item"><input type="checkbox" id="anim-touch" checked /> Touch</label>
            <label class="anim-checkbox-item"><input type="checkbox" id="anim-idle_airplane" checked /> Airplane</label><label class="anim-checkbox-item"><input type="checkbox" id="anim-idle_look" checked /> Look</label><label class="anim-checkbox-item"><input type="checkbox" id="anim-idle_loop" checked /> Idle loop</label>
            <label class="anim-checkbox-item"><input type="checkbox" id="anim-idle_shoot" checked /> Shoot</label><label class="anim-checkbox-item"><input type="checkbox" id="anim-idle_sport" checked /> Sport</label><label class="anim-checkbox-item"><input type="checkbox" id="anim-idle_stretch" checked /> Stretch</label>
            <label class="anim-checkbox-item"><input type="checkbox" id="anim-idle_vSign" checked /> V-sign</label><label class="anim-checkbox-item"><input type="checkbox" id="anim-wave_both" checked /> Wave</label><label class="anim-checkbox-item"><input type="checkbox" id="anim-wave_fast" checked /> Fast wave</label><label class="anim-checkbox-item"><input type="checkbox" id="anim-start_2turnAround" checked /> Turn around</label>
        </div></div>
        <div class="status-message" id="status">Loading VRM model...</div>
    </section>
    <section class="settings-panel" id="lipSyncPanel" aria-label="Chat"><div id="webComposerRow"><input type="text" id="textInputPanel" maxlength="4000" placeholder="Message Hikari" autocomplete="off" /><button id="speakBtnPanel" disabled aria-label="Send">➤</button></div></section>
    <script type="module" src="./app.js"></script>
</body>
</html>
